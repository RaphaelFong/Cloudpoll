<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudPoll</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f23;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    max-width: 500px;
    padding: 40px 20px;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #888;
    font-size: 1.1rem;
    margin-bottom: 16px;
  }
  .user-info {
    color: #667eea;
    font-size: 0.95rem;
    margin-bottom: 32px;
  }
  .user-info a {
    color: #888;
    text-decoration: none;
    margin-left: 12px;
    font-size: 0.85rem;
  }
  .user-info a:hover { color: #e74c3c; }
  .cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 32px 24px;
    width: 220px;
    text-decoration: none;
    color: #e0e0e0;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #667eea;
  }
  .card-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.2rem;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 0.85rem;
    color: #888;
    line-height: 1.4;
  }
  .footer {
    margin-top: 48px;
    color: #555;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>CloudPoll</h1>
  <p class="subtitle">Real-time live polling and quiz platform</p>
  <p class="user-info" id="user-info"></p>

  <div class="cards">
    <a href="/presenter" class="card">
      <div class="card-icon">&#127891;</div>
      <h2>Create Quiz</h2>
      <p>Set up questions and host a live session for your audience</p>
    </a>
    <a href="/play" class="card">
      <div class="card-icon">&#127918;</div>
      <h2>Join Quiz</h2>
      <p>Enter a session code and answer questions in real time</p>
    </a>
  </div>

  <p class="footer">CSD3156 Cloud Computing &middot; Team 32</p>
</div>

<script>
  const token = localStorage.getItem('token');
  const username = localStorage.getItem('username');

  if (!token) {
    window.location.href = '/login';
  } else {
    document.getElementById('user-info').innerHTML =
      `Logged in as <strong>${username}</strong> <a href="#" onclick="logout()">Logout</a>`;
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    window.location.href = '/login';
  }
</script>
</body>
</html>
