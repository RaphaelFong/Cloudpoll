<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudPoll - Play</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f23;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #1a1a2e;
    border-bottom: 1px solid #333;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header a {
    color: #667eea;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 700;
  }
  .score-display {
    background: #667eea;
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.95rem;
    display: none;
  }
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  /* ---- JOIN FORM ---- */
  .join-title {
    font-size: 1.5rem;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    background: #16162a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 1.1rem;
    text-align: center;
  }
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
  }
  .form-group input.code-input {
    font-size: 1.8rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    width: 100%;
    margin-top: 8px;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #667eea; color: #fff; }
  .error-msg {
    color: #e74c3c;
    font-size: 0.9rem;
    margin-top: 8px;
    display: none;
  }

  /* ---- WAITING ---- */
  #waiting-view {
    display: none;
  }
  .waiting-text {
    font-size: 1.2rem;
    color: #888;
  }
  .waiting-title {
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #667eea;
  }
  .pulse {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #667eea;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* ---- QUESTION VIEW ---- */
  #question-view {
    display: none;
    max-width: 600px;
    width: 100%;
  }
  .q-header {
    color: #667eea;
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 28px;
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .option-btn {
    padding: 20px 16px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    word-wrap: break-word;
  }
  .option-btn:hover {
    border-color: #667eea;
    background: #1e1e3a;
  }
  .option-btn.selected {
    border-color: #667eea;
    background: #2a2a5a;
  }
  .option-btn.correct {
    border-color: #27ae60;
    background: #1a3a2a;
    color: #27ae60;
  }
  .option-btn.wrong {
    border-color: #e74c3c;
    background: #3a1a1a;
    color: #e74c3c;
  }
  .option-btn.disabled {
    pointer-events: none;
    opacity: 0.7;
  }
  .option-colors {
    --c0: #667eea;
    --c1: #764ba2;
    --c2: #e67e22;
    --c3: #27ae60;
  }
  .option-btn:nth-child(1) { border-left: 4px solid var(--c0); }
  .option-btn:nth-child(2) { border-left: 4px solid var(--c1); }
  .option-btn:nth-child(3) { border-left: 4px solid var(--c2); }
  .option-btn:nth-child(4) { border-left: 4px solid var(--c3); }

  /* ---- RESULT FEEDBACK ---- */
  .result-feedback {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .result-feedback.correct {
    background: #1a3a2a;
    color: #27ae60;
    border: 1px solid #27ae60;
  }
  .result-feedback.wrong {
    background: #3a1a1a;
    color: #e74c3c;
    border: 1px solid #e74c3c;
  }

  /* ---- FINISHED ---- */
  #finished-view {
    display: none;
  }
  .final-score {
    font-size: 3rem;
    font-weight: 700;
    color: #667eea;
    margin: 16px 0;
  }
  .lb-table {
    text-align: left;
    width: 100%;
    max-width: 350px;
    margin: 16px auto 0;
  }
  .lb-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: #16162a;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .lb-row.me {
    background: #2a2a5a;
    border: 1px solid #667eea;
  }
  .lb-row.gold { border-left: 3px solid #f1c40f; }
  .lb-row.silver { border-left: 3px solid #bdc3c7; }
  .lb-row.bronze { border-left: 3px solid #e67e22; }
  .lb-rank { min-width: 36px; font-weight: 700; color: #888; }
  .lb-name { flex: 1; }
  .lb-score { font-weight: 700; color: #667eea; }
</style>
</head>
<body>

<div class="header">
  <a href="/">CloudPoll</a>
  <span class="score-display" id="score-display">0 pts</span>
</div>

<div class="main">

  <!-- ============ JOIN ============ -->
  <div class="card" id="join-view">
    <h2 class="join-title">Join a Quiz</h2>
    <div class="form-group">
      <input type="text" id="session-code" class="code-input" placeholder="CODE" maxlength="6">
    </div>
    <div class="form-group">
      <input type="text" id="player-name" placeholder="Your name">
    </div>
    <button class="btn btn-primary" onclick="joinSession()">Join</button>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- ============ WAITING ============ -->
  <div class="card" id="waiting-view">
    <p class="waiting-title" id="waiting-title"></p>
    <p class="waiting-text">
      <span class="pulse"></span>
      Waiting for the host to start...
    </p>
    <p style="color:#555;margin-top:16px;font-size:0.85rem;" id="waiting-count"></p>
  </div>

  <!-- ============ QUESTION ============ -->
  <div id="question-view" class="option-colors">
    <p class="q-header" id="play-q-header"></p>
    <p class="q-text" id="play-q-text"></p>
    <div class="options-grid" id="play-options"></div>
    <div class="result-feedback" id="result-feedback"></div>
  </div>

  <!-- ============ FINISHED ============ -->
  <div class="card" id="finished-view">
    <h2>Quiz Complete!</h2>
    <div class="final-score" id="final-score">0 pts</div>
    <div class="lb-table" id="play-lb-table"></div>
    <button class="btn btn-primary" onclick="location.href='/'" style="margin-top:20px;">Play Again</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myScore = 0;
  let myName = '';
  let hasVoted = false;
  let currentQIndex = -1;

  // Auto-focus code input
  document.getElementById('session-code').focus();

  // Enter key to join
  document.querySelectorAll('#join-view input').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') joinSession();
    });
  });

  function joinSession() {
    const code = document.getElementById('session-code').value.trim().toUpperCase();
    const name = document.getElementById('player-name').value.trim();
    const errEl = document.getElementById('error-msg');

    if (!code || code.length < 4) {
      errEl.textContent = 'Please enter a valid session code.';
      errEl.style.display = 'block';
      return;
    }
    if (!name) {
      errEl.textContent = 'Please enter your name.';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    myName = name;
    socket.emit('join-session', { code, name });
  }

  function selectOption(optionIndex) {
    if (hasVoted) return;
    hasVoted = true;

    // Highlight selected
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      btn.classList.add('disabled');
      if (i === optionIndex) btn.classList.add('selected');
    });

    socket.emit('submit-vote', {
      code: document.getElementById('session-code').value.trim().toUpperCase(),
      questionIndex: currentQIndex,
      optionIndex,
    });
  }

  // ---- Socket listeners ----

  socket.on('joined-session', ({ title, status }) => {
    document.getElementById('join-view').style.display = 'none';
    document.getElementById('waiting-view').style.display = 'block';
    document.getElementById('waiting-title').textContent = title;
    document.getElementById('score-display').style.display = 'inline-block';
  });

  socket.on('participants-updated', ({ count }) => {
    document.getElementById('waiting-count').textContent = `${count} player${count !== 1 ? 's' : ''} in lobby`;
  });

  socket.on('question-started', ({ questionIndex, totalQuestions, text, options }) => {
    hasVoted = false;
    currentQIndex = questionIndex;

    // Switch to question view
    document.getElementById('waiting-view').style.display = 'none';
    document.getElementById('question-view').style.display = 'block';
    document.getElementById('finished-view').style.display = 'none';

    document.getElementById('play-q-header').textContent =
      `Question ${questionIndex + 1} of ${totalQuestions}`;
    document.getElementById('play-q-text').textContent = text;

    const grid = document.getElementById('play-options');
    grid.innerHTML = options.map((opt, i) => `
      <button class="option-btn" onclick="selectOption(${i})">${opt}</button>
    `).join('');

    document.getElementById('result-feedback').style.display = 'none';
  });

  socket.on('vote-result', ({ correct, correctIndex, score }) => {
    myScore = score;
    document.getElementById('score-display').textContent = `${myScore} pts`;

    const fb = document.getElementById('result-feedback');
    fb.style.display = 'block';
    fb.className = 'result-feedback ' + (correct ? 'correct' : 'wrong');
    fb.textContent = correct ? 'Correct! +100 pts' : 'Wrong answer!';
  });

  socket.on('answer-revealed', ({ correctIndex }) => {
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      btn.classList.add('disabled');
      if (i === correctIndex) {
        btn.classList.add('correct');
      } else if (btn.classList.contains('selected')) {
        btn.classList.add('wrong');
      }
    });
  });

  socket.on('session-finished', ({ leaderboard }) => {
    document.getElementById('question-view').style.display = 'none';
    document.getElementById('waiting-view').style.display = 'none';
    document.getElementById('finished-view').style.display = 'block';

    document.getElementById('final-score').textContent = `${myScore} pts`;

    const table = document.getElementById('play-lb-table');
    table.innerHTML = leaderboard.map((p, i) => {
      let cls = '';
      if (i === 0) cls = 'gold';
      else if (i === 1) cls = 'silver';
      else if (i === 2) cls = 'bronze';
      if (p.name === myName) cls += ' me';
      return `
        <div class="lb-row ${cls}">
          <span class="lb-rank">#${p.rank}</span>
          <span class="lb-name">${p.name}</span>
          <span class="lb-score">${p.score} pts</span>
        </div>
      `;
    }).join('');
  });

  socket.on('error-msg', ({ message }) => {
    const errEl = document.getElementById('error-msg');
    errEl.textContent = message;
    errEl.style.display = 'block';
  });
</script>
</body>
</html>
